# Dependency & supply-chain hygiene. Grouped + weekly to stay low-noise — the
# point is to SEE a drifting dependency (the asyncssh/cryptography deprecation
# class) before it becomes a hard break, not to drown in PRs. Runs on the prod
# repo (tyxak/remotepower) where Actions are enabled.
#
# Every ecosystem has a 7-day cooldown: a release is not proposed until it has been out a week, because a
# compromised release is usually pulled within days and an update that old is the safer one to take. Security
# updates are not delayed by it. The Actions in .github/workflows are pinned to commits (tools/pin-actions.py);
# Dependabot moves the commit and its version comment together.
version: 2
updates:
  # GitHub Actions used by ci.yml / codeql.yml / release.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

  # Python runtime deps (flask, gunicorn, pydantic, bcrypt, cryptography, …).
  #
  # `directory` must point at the directory CONTAINING a manifest, and the only
  # one in this repo is packaging/requirements-server.txt. Pointed at "/" this
  # watcher resolved nothing and opened zero PRs for its whole life — the one
  # mechanism meant to surface a drifting dependency was itself the drift, and
  # it failed silently because a watcher with nothing to watch looks exactly
  # like a watcher with nothing to report.
  - package-ecosystem: "pip"
    directory: "/packaging"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python-runtime:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  # Base images of the server, agent and scanner containers (python:3.14-slim)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "docker(deps)"
