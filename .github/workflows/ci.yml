# CI for RemotePower.
#
# Runs the full test suite on every push and pull request to main.
# The suite includes the v3.0.5 strict-CSP fidelity tests in
# tests/test_v232.py::TestCSPMigrationFidelity — any future change
# that reintroduces an inline event handler, an unresolved CSS
# template, a javascript: URI, etc. will fail here before it can
# reach production.
#
# Kept deliberately small: one Python version, stdlib + pip deps the
# tests actually need, no separate lint job (the project's lint
# scope is currently two files and would add noise without value).

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # v6.4.2: was 20 (v6.2.3: was 10). On a release push this job used to run
    # the suite TWICE — `unittest discover` here, then `make dist` extracts the
    # tarball and runs the whole suite AGAIN against the staged tree — so as the
    # suite grew it blew the 20-min ceiling (the v6.4.2 release push timed out at
    # 20m4s during the dist step). The staged-tree run now lives in its own
    # parallel `dist` job below, so neither re-runs the other's suite inside one
    # budget; each keeps a full 30-min ceiling with headroom.
    timeout-minutes: 30

    # Postgres is the ENTERPRISE DEFAULT backend (v6.1.0), and until this job
    # existed no gate ran a line of it: `make check` covers JSON + SQLite, and
    # `test-pg` was reachable only from `test-all`, which nothing called. The
    # cost of that was not theoretical — storage_pg.py carries comments on
    # three parity bugs that SHIPPED, one of them noting it "could not be
    # caught locally, because tests/test_pg.py skips without a live server".
    # The 28 tests covering exactly those cases were already written. This
    # service is what finally runs them.
    #
    # Throwaway container, torn down with the job: trust auth, no password, no
    # credential literal in this file. storage_pg._ensure_schema() creates every
    # table on first connect (CREATE TABLE IF NOT EXISTS), so an empty database
    # is all it needs.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rp_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      # bcrypt + cryptography + dnspython are the runtime deps the
      # server imports unconditionally; without them the test files
      # fail at import (they exec api.py to get at internal helpers).
      # flask + gunicorn are the app server since v6.1.0 (wsgi.py) — the
      # WSGI entrypoint tests import wsgi.py, which imports flask.
      # psycopg drives the Postgres backend tests against the service above.
      # KEEP THIS LINE AND THE dist JOB'S IDENTICAL — tests/test_ci_green_parity.py
      # pins every pip line in this file equal to each other AND to Makefile CI_DEPS.
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bcrypt cryptography dnspython webauthn pysaml2 flask gunicorn pydantic 'psycopg[binary]'

      - name: Run test suite
        env:
          # Tests respect this; otherwise api.py tries to mkdir
          # /var/lib/remotepower at import time and fails on CI.
          RP_DATA_DIR: /tmp/rp-test-data
          # The Postgres service above. RP_PG_REQUIRE=1 is the load-bearing
          # half: without it tests/test_pg.py PROBES the DSN and silently
          # downgrades an unreachable server to "skip" — which would make this
          # whole job a green gate that proves nothing, the exact false-green
          # class CLAUDE.md documents. With it set, an unreachable or broken
          # Postgres fails the build instead of vanishing.
          RP_PG_TEST_DSN: postgresql://postgres@localhost:5432/rp_test
          RP_PG_REQUIRE: "1"
        run: |
          mkdir -p "$RP_DATA_DIR"
          python -m unittest discover -s tests -v 2>&1 | tail -40

  # Release-push only: build the tarball and run the suite against the EXTRACTED
  # staged tree — this catches "reads a file the dist strips" bugs that a source-
  # tree `unittest discover` can't. Its OWN job so it runs in PARALLEL with
  # `test` (each with a full budget) instead of sharing one and timing out.
  dist:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      # Identical to the test job's line by design — see the pin note there.
      # This job has no Postgres service: its purpose is the staged-tree
      # file-exclusion catch, and tests/test_pg.py correctly self-skips with no
      # DSN configured. psycopg is installed only to keep the two lines equal.
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bcrypt cryptography dnspython webauthn pysaml2 flask gunicorn pydantic 'psycopg[binary]'

      - name: Build + verify the release tarball (staged-tree suite)
        env:
          RP_DATA_DIR: /tmp/rp-dist-data
        run: |
          mkdir -p "$RP_DATA_DIR"
          # The Makefile expects a clean tree; ensure no leftover state.
          make clean
          # make dist builds the tarball AND runs the suite against the
          # extracted staged tree — the "ships fine on dev, breaks on a fresh
          # checkout" catch that `unittest discover` alone can't make.
          make dist
          ls -lh dist/
