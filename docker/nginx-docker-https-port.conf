# /etc/nginx/conf.d/remotepower-https-port.conf (http{} context)
#
# The port to put on the HTTP -> HTTPS redirect of the self-signed server
# (nginx-docker-tls.conf): ":8460" when compose publishes HTTPS on host port
# 8460, empty when it is on 443. The container cannot see the published port,
# so docker/entrypoint.sh rewrites this file from RP_PUBLIC_HTTPS_PORT, which
# docker-compose.yml fills from RP_HTTPS_PORT. This is the default.
map $host $rp_https_suffix {
    default "";
}
